<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante - Productos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍔 Gourmet POS - Productos</h1>
    <nav>
      <a href="index.html" class="active">Nuevo Pedido</a>
      <a href="productos.html" class="active">Agregar Producto</a>
      <a href="pedidos.html" class="active">Ver Ventas</a>
    </nav>
  </header>

  <main>
    <div class="grid-2">
      <section class="card">
        <h2>Nuevo Producto</h2>
        <form id="form-producto">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej: Ensalada César" required>
          </div>

          <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" id="precio" class="form-control" min="0" step="0.01" placeholder="Ej: 6.50" required>
          </div>

          <button type="submit" class="btn btn-secondary">Guardar Producto</button>
        </form>
      </section>

      <section class="card">
        <h2>Productos Disponibles</h2>
        <ul id="lista-productos" class="item-list"></ul>
      </section>
    </div>
  </main>

  <script src="catalogo.js"></script>
  <script src="productos.js"></script>
</body>
</html>
