<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurante - Toma de Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍽️ Gourmet POS - Toma de Pedidos</h1>
    <nav>
  <a href="index.html" class="active">Nuevo Pedido</a>
  <a href="productos.html" class="active">Agregar Producto</a>
  <a href="pedidos.html" class="active">Ver Ventas</a>
</nav>
  </header>

  <main>
    <div class="grid-2">
      <!-- Formulario para agregar items al pedido actual -->
      <section class="card">
        <h2>Agregar Producto</h2>
        <form id="item-form">
          <div class="form-group">
            <label for="producto">Producto</label>
            <select id="producto" class="form-control" required>
  <option value="" disabled selected>Seleccione un producto</option>
</select>
          </div>

          <div class="form-group">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" class="form-control" min="1" value="1" required>
          </div>

          <button type="submit" class="btn btn-secondary">Añadir al Pedido</button>
        </form>
      </section>

      <!-- Resumen de la orden del cliente actual -->
      <section class="card">
        <h2>Orden Actual</h2>
        <div class="form-group">
          <label for="mesa">Mesa / Nombre del Cliente</label>
          <input type="text" id="cliente" class="form-control" placeholder="Ej: Mesa 4 o Juan Pérez">
        </div>

        <ul id="lista-pedido" class="item-list">
          <!-- Los productos añadidos aparecerán aquí -->
        </ul>

        <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; margin-bottom: 1rem;">
          <span>Total:</span>
          <span id="total-pedido">$0.00</span>
        </div>

        <button id="btn-completar" class="btn">Confirmar y Enviar Pedido</button>
      </section>
    </div>
  </main>

  <script src="catalogo.js"></script>
<script src="pedido.js"></script>
</body>
</html>
